<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Xenia Web Services</title>

        <link rel="shortcut icon" type="image/png" href="assets/favicon.png" />
        <link rel="shortcut icon" type="image/svg+xml" sizes="any" href="assets/favicon.svg" />
        <link rel="apple-touch-icon" type="image/png" href="assets/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta name="description" content="Server Status" />
        <meta name="theme-color" content="#111315" />

        <!-- OG Meta Tags -->
        <meta property="og:url" content="https://xenia-netplay-2a0298c0e3f4.herokuapp.com/" />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="Xenia Web Services" />
        <meta property="og:description" content="Server Status" />
        <meta property="og:image" content="https://xenia-netplay-2a0298c0e3f4.herokuapp.com/assets/favicon.png" />

        <link rel="stylesheet" href="css/style.css">

        <script src="js/code.js" defer></script>
    </head>
    <body>
      <header class="site-header">
        <div class="brand">
          <img class="brand-logo" src="assets/xbox.svg" alt="" width="40" height="40" />
          <div>
            <h1>Xenia Web Services</h1>
            <p class="tagline">Live netplay sessions for the Xenia Xbox 360 emulator</p>
          </div>
        </div>

        <nav class="nav">
          <a href="https://github.com/AdrianCassar/xenia-canary" target="_blank" rel="noopener">GitHub</a>
          <a href="https://github.com/AdrianCassar/xenia-canary/releases" target="_blank" rel="noopener">Releases</a>
          <a href="https://github.com/AdrianCassar/xenia-canary/wiki" target="_blank" rel="noopener">Netplay Wiki</a>
        </nav>
      </header>

      <main>
        <section class="status-bar" aria-label="Server status">
          <div class="stats">
            <div class="stat">
              <span class="stat-value" id="session_count">–</span>
              <span class="stat-label">Sessions</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="player_count">–</span>
              <span class="stat-label">Players</span>
            </div>
            <div class="stat">
              <span class="stat-value" id="game_count">–</span>
              <span class="stat-label">Games</span>
            </div>
          </div>

          <div class="refresh">
            <span class="live-dot" aria-hidden="true"></span>
            <span id="countdown">Loading…</span>
            <div class="refresh-track" aria-hidden="true"><div class="refresh-bar" id="refresh_bar"></div></div>
          </div>
        </section>

        <section id="sessions" class="sessions" aria-live="polite">
          <div class="session-card skeleton" aria-hidden="true">
            <div class="sk sk-icon"></div>
            <div class="sk-lines"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
          </div>
          <div class="session-card skeleton" aria-hidden="true">
            <div class="sk sk-icon"></div>
            <div class="sk-lines"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
          </div>
          <div class="session-card skeleton" aria-hidden="true">
            <div class="sk sk-icon"></div>
            <div class="sk-lines"><div class="sk sk-line"></div><div class="sk sk-line short"></div></div>
          </div>
        </section>
      </main>

      <footer class="site-footer">
        <dl class="server-details" aria-label="Server details">
          <div>
            <dt>Commit</dt>
            <dd><a id="BUILD_COMMIT" href="https://github.com/AdrianCassar/Xenia-WebServices" target="_blank" rel="noopener">N/A</a></dd>
          </div>
          <div>
            <dt>Released</dt>
            <dd id="RELEASE_CREATED_AT">N/A</dd>
          </div>
          <div>
            <dt>Uptime</dt>
            <dd id="UPTIME">N/A</dd>
          </div>
        </dl>
      </footer>
    </body>
</html>
